name: Hospitality OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hospitality-os-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: npm run validate

  database:
    name: Supabase migrations, seed, and RLS security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start --exclude studio,imgproxy,logflare,vector

      - name: Apply migrations and seed data from a clean database
        run: supabase db reset

      - name: Run pgTAP cross-tenant security tests
        id: pgtap
        shell: bash
        run: |
          set +e
          supabase test db > /tmp/pgtap.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::group::pgTAP failure summary"
            grep -nE -B 8 -A 14 "not ok|FAILED|ERROR|error:|Dubious|Looks like|planned|tests failed" /tmp/pgtap.log || tail -n 200 /tmp/pgtap.log
            echo "::endgroup::"
          else
            tail -n 100 /tmp/pgtap.log
          fi

          exit "$status"

      - name: Upload complete pgTAP log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgtap-log
          path: /tmp/pgtap.log
          retention-days: 14
          if-no-files-found: warn

      - name: Regenerate database types from the real schema and verify they still typecheck
        run: |
          npm run supabase:types
          npm run typecheck

      - name: Fail if generated database types drift from what's committed
        run: git diff --exit-code -- lib/supabase/database.types.ts

      - name: Run integration tests against the local instance
        run: |
          supabase status -o env > /tmp/supabase-status.env
          set -a
          source /tmp/supabase-status.env
          set +a
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" npm run test:integration

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
