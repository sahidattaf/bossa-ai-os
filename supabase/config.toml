project_id = "bossa-ai-os"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
# Note: this does not grant any organization access by itself — a signed-up
# user with zero memberships still gets a permission-state page for every
# organization, exactly like the seeded outsider@example.test dev user.
# Disabling it here also disabled sign-IN for the seeded dev users, not just
# public self-registration, so it's left enabled at the Auth level.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false
